name: Build SIH ICSAP summary (pre-aggregated)

# O QUE ESTE ARQUIVO FAZ (pipeline sih-cubos, 2026-09-09; item
# sih:serie-pre-agregada — PLAN-005 do sih-br-mcp, decisão do usuário).
#
# Deriva os PRÉ-AGREGADOS da ICSAP a partir dos cubos JÁ PUBLICADOS no canal
# (função pura — não toca FTP nem microdados) e os publica em sih/cubos/,
# assinados no bloco `icsap_summary` do manifest.json (1.3.0):
# - sih_icsap_resumo.parquet: universe × year × uf × cid_revision × csap_group,
#   um arquivo com TODOS os anos (~276 KB) — a série de 34 anos do sih-br-mcp
#   passa de 310 s (1/4 vCPU, DISTINCT refeito a cada consulta) para ~1 s.
# - sih_icsap_estratos_YYYY.parquet: o DISTINCT dos estratos gravado por ano
#   (~2,5 MB/ano) — denominador para filtros finos sem refazer o DISTINCT.
# - icsap_summary_provenance.json: derived_from com o sha256 do cubo-fonte por
#   ano (contrato de frescor).
#
# QUANDO RODAR: depois de TODO rebuild de cubos (rebuild-sih-cubes.yml) que
# republique qualquer ano — o manifesto AVISA ("icsap_summary herdado está
# VELHO") quando um ano republicado deixou o resumo para trás, e o consumidor
# cai no caminho lento naquele ano até este workflow rodar. Só à mão
# (workflow_dispatch), como o da população; encadeamento automático ficou fora
# do PLAN-005 de propósito (escopo).
#
# GATES (nada sobe se falhar):
#   1. selftest do derivador: mini-cubo embutido; estratos = DISTINCT; resumo
#      reproduz o cubo nos DOIS universos; caso AC/2001 cravado (8/65 e 8/75).
#   2. cada cubo baixado confere com o sha256 do manifesto antes de derivar.
#   3. cubes-manifest.mjs --summary --verify: derived_from tem de bater com o
#      bloco `years` FINAL (resumo velho não sobe); linhas e totais conferidos
#      com DuckDB contra o sidecar.
#   4. publish-cubes.sh: arquivos → manifesto por último → Content-Length
#      conferido pelo domínio público.
#
# Mesmo concurrency group do rebuild-sih-cubes.yml e do build-sih-population.yml:
# os três reescrevem o manifest.json (cada um herda os blocos que não constrói).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Por que derivar (ex.: rebuild dos cubos de 2025; primeira publicação do PLAN-005). Vai para o summary."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rebuild-sih-cubes
  cancel-in-progress: false

env:
  PIPE: scripts/pipeline/sih-cubos
  CUBES_BASE: https://data.sidneybissoli.com/sih/cubos/
  SUMMARY_OUT: ${{ github.workspace }}/data/sih-summary

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dependências Node (DuckDB do derivador e do verify)
        run: (cd $PIPE && npm ci)

      # Gate 1: o derivador prova a própria matemática antes de tocar o canal.
      - name: Selftest do derivador
        run: node $PIPE/derive-icsap-summary.mjs --selftest

      # Gate 2 (dentro do script): cada cubo baixado confere com o sha256 do
      # manifesto; derivação com ORDER BY total e value em DECIMAL(18,2).
      - name: Derivar resumo + estratos dos cubos publicados
        run: |
          node $PIPE/derive-icsap-summary.mjs --out "$SUMMARY_OUT" --work .derive-cache
          ls -la "$SUMMARY_OUT" | head -8
          du -sh "$SUMMARY_OUT"

      # Gates 3 e 4 (dentro do publish): manifesto 1.3.0 com --summary --verify
      # (frescor por sha256 contra o bloco `years` final), upload, manifesto por
      # último, Content-Length pelo domínio.
      - name: Publicar no canal (sih/cubos/)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          bash $PIPE/publish-cubes.sh none data/sih-cubos "" "" "$SUMMARY_OUT"
          if [ -n "${{ github.event.inputs.reason }}" ]; then echo "Motivo: ${{ github.event.inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: icsap-summary
          path: |
            data/sih-summary/icsap_summary_provenance.json
            cubes-manifest.json
          retention-days: 90

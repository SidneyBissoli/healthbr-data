# ==============================================================================
# maintenance.yml — Manutenção sob demanda em VPS Hetzner efêmera
# ==============================================================================
#
# Disparado pelo sync-check.yml quando o comparison engine detecta partições
# missing/outdated nos datasets automatizados (ou manualmente via
# workflow_dispatch).
#
# Padrão lançar-e-sair: este workflow apenas CRIA a VPS e termina (~2 min).
# Ele NÃO espera a manutenção acabar — o teto rígido de 6h por job do GitHub
# Actions tornaria isso um limite artificial para rodadas longas (foi
# exatamente o modo de falha da primeira rodada). Em vez disso:
#
#   - A própria VPS se deleta ao terminar (cloud-init: roda o orquestrador,
#     sobe o log para o R2, `hcloud server delete $(hostname)`).
#   - O push dos controles de versão pela VPS re-dispara o sync-check, que
#     atualiza o dashboard com o estado pós-manutenção.
#   - maintenance-reaper.yml (cron a cada 3h) é a rede de segurança: deleta
#     qualquer VPS de manutenção desligada ou com mais de 12h de vida.
#
# Resultado da rodada: r2:healthbr-data/maintenance/last-run.json (resumo)
# e last-run.log (log completo). O marcador "started" gravado aqui é
# sobrescrito pelo orquestrador — se continuar "started", a rodada morreu.
#
# Secrets necessários (além dos já usados pelo sync-check):
#   HCLOUD_TOKEN — token da API Hetzner Cloud (permissão read+write)
#   MAINT_GH_PAT — fine-grained PAT com push no repo (commit dos controles)
# ==============================================================================

name: Maintenance (on-demand VPS)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da rodada (livre; registrado no log)'
        required: false
        default: 'manual'

# Nunca duas VPS de manutenção ao mesmo tempo (o reaper e o gatilho do
# sync-check também verificam servidores existentes antes de criar/disparar)
concurrency:
  group: maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVER_NAME: healthbr-maint-${{ github.run_id }}
      # cpx42: 8 vCPU x86, 16 GB — o tipo disponível em nbg1 (cpx41 é só EUA)
      SERVER_TYPE: cpx42
      SERVER_LOCATION: nbg1
      SNAPSHOT_SELECTOR: healthbr=maintenance

    steps:
      - uses: actions/checkout@v7

      - name: Install hcloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar xz hcloud
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Abort if a maintenance VPS already exists
        run: |
          EXISTING=$(hcloud server list --selector healthbr=maintenance-run -o json | jq length)
          if [ "$EXISTING" != "0" ]; then
            echo "Já existe VPS de manutenção ativa — não criando outra."
            hcloud server list --selector healthbr=maintenance-run
            exit 1
          fi

      - name: Find maintenance snapshot
        id: snapshot
        run: |
          IMAGE_ID=$(hcloud image list --type snapshot \
            --selector "$SNAPSHOT_SELECTOR" -o json \
            | jq -r 'sort_by(.created) | last | .id // empty')
          if [ -z "$IMAGE_ID" ]; then
            echo "ERRO: nenhum snapshot com label $SNAPSHOT_SELECTOR."
            echo "Crie a imagem base com scripts/maintenance/setup-snapshot.sh."
            exit 1
          fi
          echo "Snapshot: $IMAGE_ID"
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      # Sobrescreve o resumo da rodada anterior ANTES de criar a VPS: se a
      # manutenção morrer sem gravar o dela, o last-run.json fica "started" —
      # sinal inequívoco de rodada morta (em vez de um "success" antigo).
      - name: Mark run as started
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          jq -n --arg run_id "${{ github.run_id }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg reason "${{ inputs.reason }}" \
            '{status: "started", run_id: $run_id, timestamp: $ts, reason: $reason}' \
            | aws s3 cp - s3://healthbr-data/maintenance/last-run.json \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      - name: Render cloud-init user data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MAINT_GH_PAT: ${{ secrets.MAINT_GH_PAT }}
          HCLOUD_TOKEN_VPS: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          cat > user-data.yml <<EOF
          #cloud-config
          write_files:
            - path: /root/maint.env
              permissions: "0600"
              content: |
                export R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
                export R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
                export R2_ENDPOINT=${R2_ENDPOINT}
                export GH_PAT=${MAINT_GH_PAT}
                export HCLOUD_TOKEN=${HCLOUD_TOKEN_VPS}
          runcmd:
            - |
              bash -c '
              set -x
              source /root/maint.env
              curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz -C /usr/local/bin hcloud
              rclone config create r2 s3 provider Cloudflare \
                access_key_id "\$R2_ACCESS_KEY_ID" \
                secret_access_key "\$R2_SECRET_ACCESS_KEY" \
                endpoint "\$R2_ENDPOINT" >/dev/null
              git clone "https://x-access-token:\${GH_PAT}@github.com/${{ github.repository }}.git" /root/healthbr-data
              bash /root/healthbr-data/scripts/maintenance/run-maintenance.sh >> /root/maintenance.log 2>&1
              rclone copyto /root/maintenance.log r2:healthbr-data/maintenance/last-run.log --s3-no-check-bucket
              hcloud server delete "\$(hostname)" || shutdown -h now'
          EOF
          echo "user-data.yml gerado ($(wc -l < user-data.yml) linhas)"

      - name: Create VPS
        run: |
          hcloud server create \
            --name "$SERVER_NAME" \
            --type "$SERVER_TYPE" \
            --location "$SERVER_LOCATION" \
            --image "${{ steps.snapshot.outputs.image_id }}" \
            --user-data-from-file user-data.yml \
            --ssh-key hetzner-sipni \
            --label healthbr=maintenance-run

      - name: Summary
        run: |
          echo "VPS $SERVER_NAME lançada. A rodada segue de forma autônoma:"
          echo "- resumo:  r2:healthbr-data/maintenance/last-run.json"
          echo "- log:     r2:healthbr-data/maintenance/last-run.log"
          echo "- a VPS se deleta ao terminar; o reaper (cron 3h) é o backstop"
          echo "- o push dos controles pela VPS re-dispara o sync-check"

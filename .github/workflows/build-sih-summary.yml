name: Build SIH pre-aggregated summaries (ICSAP + causas)

# O QUE ESTE ARQUIVO FAZ (pipeline sih-cubos; ICSAP em 2026-09-09, item
# sih:serie-pre-agregada / PLAN-005; CAUSAS em 2026-09-10, item
# sih:causas-pre-agregada / PLAN-006 — decisões do usuário).
#
# Deriva os DOIS conjuntos de PRÉ-AGREGADOS a partir dos cubos JÁ PUBLICADOS no
# canal (função pura — não toca FTP nem microdados) e os publica em sih/cubos/,
# assinados no manifest.json (1.4.0):
#
# Bloco `icsap_summary` (dos cubos sih_icsap_*):
# - sih_icsap_resumo.parquet: universe × year × uf × cid_revision × csap_group,
#   um arquivo com TODOS os anos (~276 KB) — a série de 34 anos do sih-br-mcp
#   passa de 310 s (1/4 vCPU, DISTINCT refeito a cada consulta) para ~1 s.
# - sih_icsap_estratos_YYYY.parquet: o DISTINCT dos estratos gravado por ano.
#
# Bloco `causas_summary` (dos cubos sih_causas_*, que pesam 1.253 MB nos 34 anos):
# - sih_causas_resumo.parquet: GRÃO A — year × uf × cid_chapter × cid_revision ×
#   is_csap × exclusion com n, days, value e deaths (0,6 MB nos 34 anos).
# - sih_causas_estratos_YYYY.parquet: GRÃO B — o grão A mais sexo, faixa etária
#   quinquenal e raça (~0,55 MB/ano; 18,8 MB nos 34).
#
# E os dois sidecars, com `derived_from` = sha256 do cubo-fonte por ano.
#
# POR QUE OS DOIS NO MESMO WORKFLOW: eles saem da mesma leitura do canal,
# escrevem no MESMO manifest.json e precisam subir juntos — um rebuild de cubos
# que deixe um resumo fresco e o outro velho é exatamente o defeito a evitar.
# O `.derive-cache` também é compartilhado (summary-lib.mjs): cada cubo é
# baixado e conferido uma vez só.
#
# QUANDO RODAR: depois de TODO rebuild de cubos (rebuild-sih-cubes.yml) que
# republique qualquer ano — o manifesto AVISA ("icsap_summary/causas_summary
# herdado está VELHO") quando um ano republicado deixou um resumo para trás, e
# o consumidor cai no caminho lento naquele ano até este workflow rodar. Só à
# mão (workflow_dispatch), como o da população; encadeamento automático ficou
# fora dos dois planos de propósito (escopo).
#
# GATES (nada sobe se falhar):
#   1. selftest dos DOIS derivadores, com mini-cubo embutido: na ICSAP,
#      estratos = DISTINCT e resumo reproduz o cubo nos dois universos (caso
#      AC/2001 cravado); nas causas, o grão B reproduz o cubo nas QUATRO
#      medidas, o grão A reproduz o B, e as fronteiras da faixa etária
#      (0, 4, 5, 79, 80, 95 e nula) estão cravadas.
#   2. cada cubo baixado confere com o sha256 do manifesto antes de derivar.
#   3. na derivação das causas, CADA ANO do grão B é conferido contra o cubo
#      nas quatro medidas, e o grão A contra os mesmos totais.
#   4. cubes-manifest.mjs --summary --causas-summary --verify: os dois
#      derived_from têm de bater com o bloco `years` FINAL (resumo velho não
#      sobe); linhas e totais reconferidos com DuckDB contra os sidecars.
#   5. publish-cubes.sh: arquivos → manifesto por último → Content-Length
#      conferido pelo domínio público.
#
# Mesmo concurrency group do rebuild-sih-cubes.yml e do build-sih-population.yml:
# os três reescrevem o manifest.json (cada um herda os blocos que não constrói).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Por que derivar (ex.: rebuild dos cubos de 2025; primeira publicação do PLAN-006). Vai para o summary."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rebuild-sih-cubes
  cancel-in-progress: false

env:
  PIPE: scripts/pipeline/sih-cubos
  CUBES_BASE: https://data.sidneybissoli.com/sih/cubos/
  SUMMARY_OUT: ${{ github.workspace }}/data/sih-summary

jobs:
  build:
    runs-on: ubuntu-latest
    # 90 min (era 45 até o PLAN-006): agora baixa também os 1,25 GB dos cubos
    # de causas. Local, com os dois já em cache, a derivação inteira leva
    # ~1 min; a folga é para o download.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dependências Node (DuckDB dos derivadores e do verify)
        run: (cd $PIPE && npm ci)

      # Gate 1: cada derivador prova a própria matemática antes de tocar o canal.
      - name: Selftest dos derivadores
        run: |
          node $PIPE/derive-icsap-summary.mjs --selftest
          node $PIPE/derive-causas-summary.mjs --selftest

      # Gate 2 (dentro dos scripts): cada cubo baixado confere com o sha256 do
      # manifesto; derivação com ORDER BY total e value em DECIMAL(18,2).
      - name: Derivar resumo + estratos da ICSAP
        run: node $PIPE/derive-icsap-summary.mjs --out "$SUMMARY_OUT" --work .derive-cache

      # Gate 3 (dentro do script): cada ano do grão B conferido contra o cubo
      # nas quatro medidas; o grão A, rolado do B, contra os mesmos totais.
      - name: Derivar grão A + grão B do cubo de causas
        run: |
          node $PIPE/derive-causas-summary.mjs --out "$SUMMARY_OUT" --work .derive-cache
          ls -la "$SUMMARY_OUT" | head -8
          du -sh "$SUMMARY_OUT" .derive-cache

      # Gates 4 e 5 (dentro do publish): manifesto 1.4.0 com --summary
      # --causas-summary --verify (frescor por sha256 contra o bloco `years`
      # final), upload, manifesto por último, Content-Length pelo domínio.
      - name: Publicar no canal (sih/cubos/)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          bash $PIPE/publish-cubes.sh none data/sih-cubos "" "" "$SUMMARY_OUT" "$SUMMARY_OUT"
          if [ -n "${{ github.event.inputs.reason }}" ]; then echo "Motivo: ${{ github.event.inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sih-summaries
          path: |
            data/sih-summary/icsap_summary_provenance.json
            data/sih-summary/causas_summary_provenance.json
            cubes-manifest.json
          retention-days: 90

name: Weekly Sync Check

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3:00 AM UTC
  workflow_dispatch:        # Manual trigger for testing
  push:                     # Pós-manutenção: o push dos controles pela VPS
    branches: [master]      # re-roda o check e atualiza o dashboard
    paths:
      - 'data/controle_versao_*.csv'

permissions:
  contents: read
  actions: write   # disparar maintenance.yml quando houver deriva

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Run comparison engine
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/sync/sync_check.py --output sync-status.json

      - name: Upload sync-status.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install awscli
          aws s3 cp sync-status.json s3://healthbr-data/sync-status.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT }}

      - name: Push sync-status.json to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://SidneyBissoli:$HF_TOKEN@huggingface.co/spaces/SidneyBissoli/healthbr-sync-status hf-space
          cp sync-status.json hf-space/src/sync-status.json
          cd hf-space
          git config user.name "healthbr-sync-bot"
          git config user.email "noreply@healthbr-data.org"
          # O HF rejeita arquivos > 10 MiB fora do LFS; o sync-status.json
          # passou desse tamanho com o sih-sp (9.6k partições)
          git lfs install --local
          git lfs track "src/sync-status.json"
          git add .gitattributes src/sync-status.json
          git commit -m "Update sync status $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push

      # Manutenção condicional: se algum dataset automatizado tem partições
      # missing/outdated, dispara a rodada de manutenção (VPS sob demanda).
      # Datasets estáticos (agregados, dicionários) ficam de fora — deriva
      # neles é anômala e pede inspeção manual.
      # NUNCA dispara em evento push (o push vem da própria manutenção;
      # disparar aqui criaria um loop VPS → push → sync-check → VPS).
      - name: Trigger maintenance if drift detected
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING=$(python - <<'EOF'
          import json
          AUTOMATED = ["sinasc", "sih-rd", "sih-sp", "sipni-microdados", "sipni-covid"]
          data = json.load(open("sync-status.json"))
          pending = []
          for key in AUTOMATED:
              ds = data.get("datasets", {}).get(key, {})
              if ds.get("status") == "check_failed":
                  continue
              s = ds.get("summary", {})
              if s.get("missing", 0) > 0 or s.get("outdated", 0) > 0:
                  pending.append(key)
          print(",".join(pending))
          EOF
          )
          if [ -z "$PENDING" ]; then
            echo "Datasets automatizados em sincronia — manutenção desnecessária."
            exit 0
          fi
          # Se já houver VPS de manutenção ativa, o maintenance.yml aborta
          # sozinho (step "Abort if a maintenance VPS already exists").
          echo "Deriva detectada em: $PENDING — disparando manutenção."
          gh workflow run maintenance.yml --ref "${GITHUB_REF_NAME}" \
            -f reason="auto: $PENDING"
